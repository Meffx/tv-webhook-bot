# Mosquitto settings for the Control4 gateway. Installed by setup.sh as
# /etc/mosquitto/conf.d/c4-gateway.conf.

allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Controllers connect here from the internet, over TLS.
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem

# The backend on this server connects here; not reachable from outside.
listener 1883 127.0.0.1
